[package]
name = "read-desktop"
version = "0.1.1"
description = "Read Atlas academic PDF reading workspace"
authors = ["Fang Zikai"]
license = "MIT"
rust-version = "1.96.1"
edition = "2021"

[lib]
name = "read_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
base64 = "0.23"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
async-trait = "0.1"
flate2 = "1.0"
fs2 = "0.4"
futures-util = "0.3"
notify = "8.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# This crate is compiled as staticlib + cdylib + rlib. Default
# `debug = 2` plus 256 incremental codegen units OOMs rustc/LLVM on
# Windows (`rustc-LLVM ERROR: out of memory`, exit `0xc0000409`).
# Keep line tables on this package; skip debuginfo on dependencies.
# Also see `.cargo/config.toml` (`build.jobs = 2`).
[profile.dev]
debug = 1
codegen-units = 16

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
